  <head>

    <link rel="icon" type="image/png" href="/nocte-logo.png" />
    <link rel="apple-touch-icon" href="/nocte-logo.png" />
    <title>Nocte Ventures</title>
    <meta
      name="description"
      content="Nocte Ventures builds and owns digital products, and works with a small number of companies on strategy, product, and technical execution."
    />
    <link rel="canonical" href="https://www.nocteventures.com/" />
    <meta name="robots" content="index, follow, max-snippet:-1" />

    <meta property="og:title" content="Nocte Ventures" />
    <meta property="og:description" content="Nocte Ventures builds and owns digital products, and works with a small number of companies on strategy, product, and technical execution." />
    <meta property="og:image" content="https://www.nocteventures.com/nocte-logo.png" />
    <meta property="og:url" content="https://www.nocteventures.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nocte Ventures" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Nocte Ventures" />
    <meta
      name="twitter:description"
      content="Nocte Ventures builds and owns digital products, and works with a small number of companies on strategy, product, and technical execution."
    />
    <meta name="twitter:image" content="https://www.nocteventures.com/nocte-logo.png" />


    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Nocte Ventures",
        "legalName": "Nocte Ventures Ltd",
        "url": "https://www.nocteventures.com",
        "logo": "https://www.nocteventures.com/nocte-logo.png",
        "description": "Nocte Ventures builds and owns digital products, and works with a small number of companies on strategy, product, and technical execution.",
        "email": "hello@nocteventures.com",
        "foundingLocation": {
          "@type": "Country",
          "name": "United Kingdom"
        },
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "GB"
        },
        "sameAs": ["https://www.instagram.com/nocteventures/"]
      }
    </script>
    <link
      rel="preload"
      href="/fonts/satoshi-900.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/satoshi-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
<body>
  <div id="root">
      <style>
        .njs{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.9rem;background:#06080F;color:#EEF1F8;font-family:'Helvetica Neue',Arial,sans-serif;text-align:center;padding:2rem}
        .njs h1{font-size:clamp(2rem,6vw,4.5rem);font-weight:800;letter-spacing:-0.04em;line-height:0.95;max-width:20ch}
        .njs p{color:#8B94AA;font-size:1.05rem;max-width:46ch;line-height:1.6}
      </style>
      <div class="njs">
        <h1>We build software worth owning.</h1>
        <p>Nocte Ventures — we build and own digital products.</p>
      </div>
    </div>
    <!-- Opening sequence. Lives here, not in React, so it is present in the
         very first painted frame; it removes itself once played, and only
         plays once per browser session. -->
    <div id="nv-curtain" class="curtain" aria-hidden="true">
      <div class="curtain-stack">
        <div class="curtain-mark"></div>
        <div class="curtain-line"></div>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('nv-curtain');
        if (!el) return;
        var still =
          window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var seen = false;
        try { seen = !!sessionStorage.getItem('nv-intro'); } catch (e) {}
        if (still || seen) { el.parentNode.removeChild(el); return; }
        try { sessionStorage.setItem('nv-intro', '1'); } catch (e) {}
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 2600);
      })();
    </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
